services:
  application:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
      # Кэш слоёв между прогонами CI. Читаем из директории, восстановленной
      # actions/cache, пишем в отдельную — иначе экспорт наслаивается на импорт
      # и кэш растёт неограниченно. Требует драйвер docker-container
      # (docker/setup-buildx-action), стандартный docker-драйвер не умеет
      # экспортировать кэш.
      cache_from:
        - type=local,src=/tmp/.docker-cache
      cache_to:
        - type=local,dest=/tmp/.docker-cache-new,mode=min
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: hexlet_sicp
      DB_USERNAME: postgres
      TEST_DB_HOST: database
      TEST_DB_PORT: 5432
      TEST_DB_DATABASE: hexlet_sicp_test
      TEST_DB_USERNAME: postgres
      # Кэш composer и стор pnpm внутри бинд-маунта, а не в $HOME
      # контейнера — иначе их не видно с хоста и нечего отдавать
      # actions/cache. Заодно стор лежит на одной ФС с node_modules, и pnpm
      # ставит пакеты хардлинками, а не копированием.
      COMPOSER_CACHE_DIR: /app/.composer-cache
      pnpm_config_store_dir: /app/.pnpm-store
    command: ["make", "test-coverage", "analyse", "lint"]

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./database/docker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
